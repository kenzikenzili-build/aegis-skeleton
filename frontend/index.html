<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AegisSkeleton // JRPG Holy Ward: Paladin vs Zombies</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-void: #050508;
            --jrpg-gold: #fbbf24;
            --jrpg-red: #ef4444;
            --jrpg-green: #22c55e;
            --jrpg-blue: #38bdf8;
            --hud-bg: #0f172a;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            background-color: var(--bg-void);
            color: #fff;
            font-family: 'Press Start 2P', monospace;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 16px;
            overflow-x: hidden;
        }
        .hud-top {
            width: 100%;
            max-width: 860px;
            background: var(--hud-bg);
            border: 4px solid #fff;
            box-shadow: 0 6px 0 #000;
            padding: 12px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 10px;
            line-height: 1.8;
            margin-bottom: 16px;
        }
        .battle-arena {
            width: 100%;
            max-width: 860px;
            height: 380px;
            border: 4px solid #fff;
            box-shadow: 0 8px 0 #000;
            position: relative;
            overflow: hidden;
            background: linear-gradient(180deg, #020617 0%, #172554 60%, #451a03 100%);
        }
        .moon {
            position: absolute;
            top: 25px;
            right: 60px;
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: #f97316;
            box-shadow: 0 0 35px #f97316;
            border: 4px solid #ea580c;
        }
        .floor {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 70px;
            background: #1c1917;
            border-top: 4px solid #78716c;
            background-image: radial-gradient(#292524 15%, transparent 16%), radial-gradient(#44403c 15%, transparent 16%);
            background-size: 16px 16px;
            background-position: 0 0, 8px 8px;
        }
        .entity {
            position: absolute;
            bottom: 60px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: all 0.2s cubic-bezier(0.18, 0.89, 0.32, 1.28);
        }
        #hero { left: 80px; z-index: 10; }
        .zombie-team {
            position: absolute;
            right: 70px;
            bottom: 60px;
            display: flex;
            gap: 25px;
            z-index: 10;
        }
        .zombie-unit {
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: all 0.3s ease;
        }
        .paladin-sprite {
            width: 80px;
            height: 96px;
            position: relative;
            animation: breathe 1.2s infinite alternate ease-in-out;
            transform-origin: bottom center;
        }
        @keyframes breathe {
            0% { transform: translateY(0) scaleY(1); }
            100% { transform: translateY(-4px) scaleY(1.03); }
        }
        .zombie-sprite {
            width: 72px;
            height: 86px;
            position: relative;
            animation: zombieHop 1.4s infinite alternate ease-in-out;
            transform-origin: bottom center;
        }
        @keyframes zombieHop {
            0% { transform: translateY(0) rotate(-1deg); }
            100% { transform: translateY(-5px) rotate(2deg); }
        }
        .hero-charge {
            transform: translateX(380px) scale(1.2) !important;
        }
        .crit-slash {
            position: absolute;
            width: 140px;
            height: 140px;
            pointer-events: none;
            display: none;
            z-index: 30;
            background: radial-gradient(circle, rgba(251,191,36,0.9) 0%, rgba(239,68,68,0) 70%);
            border-radius: 50%;
        }
        .dmg-popup {
            position: absolute;
            font-size: 13px;
            color: var(--jrpg-gold);
            text-shadow: 2px 2px 0 #000, 0 0 10px var(--jrpg-gold);
            pointer-events: none;
            animation: floatUp 0.8s forwards;
            z-index: 40;
        }
        @keyframes floatUp {
            0% { transform: translateY(0) scale(0.6); opacity: 0; }
            40% { transform: translateY(-30px) scale(1.3); opacity: 1; }
            100% { transform: translateY(-60px) scale(1); opacity: 0; }
        }
        .shake {
            animation: screenShake 0.3s cubic-bezier(.36,.07,.19,.97) both;
        }
        @keyframes screenShake {
            10%, 90% { transform: translate3d(-3px, 0, 0); }
            20%, 80% { transform: translate3d(5px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-8px, 0, 0); }
            40%, 60% { transform: translate3d(8px, 0, 0); }
        }
        .dock {
            width: 100%;
            max-width: 860px;
            display: grid;
            grid-template-columns: 1.4fr 1fr;
            gap: 16px;
            margin-top: 16px;
        }
        .dialogue-panel {
            background: #020617;
            border: 4px solid #fff;
            box-shadow: 0 6px 0 #000;
            padding: 14px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            height: 150px;
            overflow-y: auto;
            color: #94a3b8;
            line-height: 1.6;
        }
        .cmd-panel {
            background: #020617;
            border: 4px solid #fff;
            box-shadow: 0 6px 0 #000;
            padding: 12px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .btn-jrpg {
            background: #1e293b;
            border: 3px solid #64748b;
            color: #fff;
            font-family: 'Press Start 2P', monospace;
            font-size: 9px;
            padding: 10px 4px;
            cursor: pointer;
            transition: all 0.1s;
        }
        .btn-jrpg:hover {
            background: var(--jrpg-gold);
            color: #000;
            border-color: #fff;
            transform: translateY(-2px);
            box-shadow: 0 4px 0 #fff;
        }
        .btn-jrpg:active {
            transform: translateY(2px);
            box-shadow: none;
        }
    </style>
</head>
<body>
    <div class="hud-top">
        <div>
            <div style="color: var(--jrpg-gold);">🎃 PALADIN: LV.99 [DIVINE]</div>
            <div style="color: var(--jrpg-green); margin-top: 4px;">IDLE ARCH: $0.000 / HR</div>
        </div>
        <div style="text-align: right;">
            <div id="hudBurn" style="color: var(--jrpg-red);">BURN DEFICIT: $0.096 / HR</div>
            <div id="hudZombies" style="color: #94a3b8; margin-top: 4px;">ROGUE ENTITIES: 1</div>
        </div>
    </div>
    <div class="battle-arena" id="arena">
        <div class="moon"></div>
        <div class="floor"></div>
        <div class="entity" id="hero">
            <div style="font-size: 8px; color: var(--jrpg-gold); margin-bottom: 4px;">AEGIS</div>
            <svg class="paladin-sprite" viewBox="0 0 40 48" fill="none">
                <path d="M12 20 L4 44 L18 42 Z" fill="#991b1b" />
                <rect x="14" y="22" width="14" height="16" fill="#fbbf24" stroke="#b45309" stroke-width="1.5" />
                <rect x="18" y="26" width="6" height="8" fill="#38bdf8" />
                <rect x="6" y="24" width="4" height="4" fill="#fbbf24" />
                <path d="M4 24 L-2 4 L0 2 L8 22 Z" fill="#f8fafc" stroke="#94a3b8" stroke-width="1" />
                <rect x="10" y="6" width="22" height="16" rx="4" fill="#ea580c" stroke="#9a3412" stroke-width="1.5" />
                <rect x="19" y="2" width="4" height="5" fill="#15803d" />
                <polygon points="14,11 17,11 15,14" fill="#020617" />
                <polygon points="25,11 28,11 27,14" fill="#020617" />
                <polygon points="16,17 19,19 22,17 25,19 27,17 22,21" fill="#020617" />
                <rect x="15" y="38" width="4" height="6" fill="#78350f" />
                <rect x="23" y="38" width="4" height="6" fill="#78350f" />
            </svg>
        </div>
        <div class="zombie-team" id="zombieTeam">
            <div class="zombie-unit" id="z-unit-1">
                <div style="font-size: 7px; color: #fca5a5; margin-bottom: 4px;">EC2:ZOMBIE</div>
                <div style="width: 44px; height: 5px; background: #ef4444; border: 1px solid #fff; margin-bottom: 4px;">
                    <div style="width: 100%; height: 100%; background: #22c55e;"></div>
                </div>
                <svg class="zombie-sprite" viewBox="0 0 40 48" fill="none">
                    <rect x="14" y="22" width="14" height="16" fill="#374151" stroke="#1f2937" stroke-width="1.5" />
                    <rect x="4" y="24" width="12" height="5" fill="#15803d" />
                    <rect x="12" y="8" width="18" height="15" rx="3" fill="#16a34a" stroke="#14532d" stroke-width="1.5" />
                    <rect x="15" y="12" width="3" height="3" fill="#ef4444" />
                    <rect x="24" y="12" width="3" height="3" fill="#ef4444" />
                    <polygon points="16,18 26,17 23,21 18,21" fill="#020617" />
                    <rect x="15" y="38" width="4" height="6" fill="#1f2937" />
                    <rect x="23" y="38" width="4" height="6" fill="#1f2937" />
                </svg>
            </div>
        </div>
        <div class="crit-slash" id="critFx"></div>
    </div>
    <div class="dock">
        <div class="dialogue-panel" id="logBox">
            <div style="color: var(--jrpg-gold);">> SKELETON CREW INITIATED.</div>
            <div>> CloudTrail scan: Rogue EC2 Zombie detected ($0.096/hr).</div>
            <div>> Pre-commit Hook: Aegis Smite standing by.</div>
        </div>
        <div class="cmd-panel">
            <button class="btn-jrpg" style="border-color: var(--jrpg-gold);" onclick="castSmite()">⚔️ SMITE</button>
            <button class="btn-jrpg" style="border-color: var(--jrpg-red);" onclick="castAllSmite()">🔥 ALL SMITE</button>
            <button class="btn-jrpg" style="border-color: var(--jrpg-blue);" onclick="castReconcile()">📜 RECONCILE</button>
            <button class="btn-jrpg" style="border-color: var(--jrpg-green);" onclick="spawnZombie()">🧟 SUMMON</button>
        </div>
    </div>
    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSfx(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            if (type === 'slash') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(440, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(110, audioCtx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.15);
            } else if (type === 'crit') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(880, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(220, audioCtx.currentTime + 0.25);
                gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.25);
            }
        }
        const arena = document.getElementById('arena');
        const hero = document.getElementById('hero');
        const team = document.getElementById('zombieTeam');
        const critFx = document.getElementById('critFx');
        const logBox = document.getElementById('logBox');
        let zombies = [{ id: 1 }];
        let serial = 1;

        function addLog(msg, col = '#94a3b8') {
            const row = document.createElement('div');
            row.style.color = col;
            row.innerText = `> ${msg}`;
            logBox.prepend(row);
        }
        function updateHud() {
            const count = zombies.length;
            const burn = count * 0.096;
            document.getElementById('hudBurn').innerText = `BURN DEFICIT: $${burn.toFixed(3)} / HR`;
            document.getElementById('hudZombies').innerText = `ROGUE ENTITIES: ${count}`;
        }
        function popupText(x, y, txt, col = '#fbbf24') {
            const p = document.createElement('div');
            p.className = 'dmg-popup';
            p.style.left = `${x}px`;
            p.style.top = `${y}px`;
            p.style.color = col;
            p.innerText = txt;
            arena.appendChild(p);
            setTimeout(() => p.remove(), 800);
        }
        function shakeArena() {
            arena.classList.add('shake');
            setTimeout(() => arena.classList.remove('shake'), 300);
        }
        function castSmite() {
            if (zombies.length === 0) {
                addLog('No zombies to smite! Sanctuary is safe.', '#fbbf24');
                return;
            }
            hero.classList.add('hero-charge');
            setTimeout(() => {
                playSfx('slash');
                shakeArena();
                const target = document.querySelector('.zombie-unit');
                if (target) {
                    const rect = target.getBoundingClientRect();
                    const aRect = arena.getBoundingClientRect();
                    critFx.style.left = `${rect.left - aRect.left - 30}px`;
                    critFx.style.top = `${rect.top - aRect.top - 20}px`;
                    critFx.style.display = 'block';
                    setTimeout(() => critFx.style.display = 'none', 200);
                    popupText(rect.left - aRect.left, rect.top - aRect.top, '9999 SMITE!');
                    target.style.transform = 'scale(0) rotate(45deg)';
                    target.style.opacity = '0';
                    setTimeout(() => {
                        target.remove();
                        zombies.shift();
                        updateHud();
                    }, 250);
                }
                addLog('⚡ AEGIS SMITE: Rogue zombie terminated! Saved $0.096/hr.', '#fbbf24');
            }, 180);
            setTimeout(() => hero.classList.remove('hero-charge'), 380);
        }
        function castAllSmite() {
            if (zombies.length === 0) {
                addLog('Zero rogue entities. Divine realm pure!', '#22c55e');
                return;
            }
            hero.classList.add('hero-charge');
            setTimeout(() => {
                playSfx('crit');
                shakeArena();
                const all = document.querySelectorAll('.zombie-unit');
                all.forEach((z) => {
                    const rect = z.getBoundingClientRect();
                    const aRect = arena.getBoundingClientRect();
                    popupText(rect.left - aRect.left, rect.top - aRect.top, 'CRIT 9999!', '#ef4444');
                    z.style.transform = 'scale(0) rotate(-45deg)';
                    z.style.opacity = '0';
                    setTimeout(() => z.remove(), 250);
                });
                zombies = [];
                updateHud();
                addLog('🔥 HOLY STORM: All zombies incinerated! Idle rate $0.000 restored!', '#ef4444');
            }, 200);
            setTimeout(() => hero.classList.remove('hero-charge'), 400);
        }
        function castReconcile() {
            playSfx('slash');
            shakeArena();
            popupText(100, 160, '+10 TX SETTLED', '#38bdf8');
            addLog('📜 GrimReconciler: 10 transactions settled to DynamoDB (TTL 7-Day).', '#38bdf8');
        }
        function spawnZombie() {
            serial++;
            zombies.push({ id: serial });
            const z = document.createElement('div');
            z.className = 'zombie-unit';
            z.id = `z-unit-${serial}`;
            z.innerHTML = `
                <div style="font-size: 7px; color: #fca5a5; margin-bottom: 4px;">RDS:ZOMBIE</div>
                <div style="width: 44px; height: 5px; background: #ef4444; border: 1px solid #fff; margin-bottom: 4px;">
                    <div style="width: 100%; height: 100%; background: #22c55e;"></div>
                </div>
                <svg class="zombie-sprite" viewBox="0 0 40 48" fill="none">
                    <rect x="14" y="22" width="14" height="16" fill="#374151" stroke="#1f2937" stroke-width="1.5" />
                    <rect x="4" y="24" width="12" height="5" fill="#15803d" />
                    <rect x="12" y="8" width="18" height="15" rx="3" fill="#16a34a" stroke="#14532d" stroke-width="1.5" />
                    <rect x="15" y="12" width="3" height="3" fill="#ef4444" />
                    <rect x="24" y="12" width="3" height="3" fill="#ef4444" />
                    <polygon points="16,18 26,17 23,21 18,21" fill="#020617" />
                    <rect x="15" y="38" width="4" height="6" fill="#1f2937" />
                    <rect x="23" y="38" width="4" height="6" fill="#1f2937" />
                </svg>
            `;
            team.appendChild(z);
            updateHud();
            addLog(`⚠️ UNBUDGETED: Rogue Zombie #${serial} spawned! +$0.096/hr!`, '#ef4444');
        }
    </script>
</body>
</html>
