<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AegisSkeleton // JRPG Holy Ward: Paladin vs Zombies</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-void: #0d0f18;
            --jrpg-gold: #facc15;
            --jrpg-red: #ef4444;
            --jrpg-green: #22c55e;
            --jrpg-blue: #3b82f6;
            --panel-border: #475569;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            background-color: var(--bg-void);
            color: #fff;
            font-family: 'Press Start 2P', monospace;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }

        /* 頂部經典 JRPG 狀態列 */
        .hud-bar {
            width: 100%;
            max-width: 900px;
            background: #1e293b;
            border: 4px solid #fff;
            box-shadow: 0 6px 0 #0f172a;
            padding: 12px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-size: 11px;
            line-height: 1.8;
        }
        .burn-alert {
            color: var(--jrpg-red);
            text-shadow: 0 0 8px var(--jrpg-red);
        }

        /* 戰鬥舞台 Canvas 容器 */
        .arena-container {
            width: 100%;
            max-width: 900px;
            height: 340px;
            background: linear-gradient(180deg, #111827 0%, #1e1b4b 60%, #311042 100%);
            border: 4px solid #fff;
            box-shadow: 0 8px 0 #000;
            position: relative;
            overflow: hidden;
            border-radius: 4px;
        }
        #battleCanvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* JRPG 經典戰鬥選單與資訊框 */
        .ui-dock {
            width: 100%;
            max-width: 900px;
            display: grid;
            grid-template-columns: 1.4fr 1fr;
            gap: 16px;
            margin-top: 20px;
        }

        .dialog-box {
            background: #020617;
            border: 4px solid #fff;
            box-shadow: 0 6px 0 #000;
            padding: 16px;
            min-height: 170px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .dialog-title {
            font-size: 10px;
            color: var(--jrpg-gold);
            margin-bottom: 8px;
            border-bottom: 2px dashed #334155;
            padding-bottom: 6px;
        }
        .dialog-logs {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            color: #94a3b8;
            flex: 1;
            overflow-y: auto;
            max-height: 100px;
            line-height: 1.6;
        }

        .cmd-box {
            background: #020617;
            border: 4px solid #fff;
            box-shadow: 0 6px 0 #000;
            padding: 14px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .cmd-btn {
            background: #1e293b;
            border: 2px solid #64748b;
            color: #fff;
            font-family: 'Press Start 2P', monospace;
            font-size: 9px;
            padding: 10px 6px;
            cursor: pointer;
            text-align: center;
            transition: all 0.1s;
        }
        .cmd-btn:hover {
            background: var(--jrpg-gold);
            color: #000;
            border-color: #fff;
            transform: scale(1.05);
        }
        .cmd-btn:active {
            transform: scale(0.95);
        }

        /* 屏幕震動效果 */
        .screen-shake {
            animation: shake 0.35s cubic-bezier(.36,.07,.19,.97) both;
        }
        @keyframes shake {
            10%, 90% { transform: translate3d(-2px, 0, 0); }
            20%, 80% { transform: translate3d(4px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
            40%, 60% { transform: translate3d(6px, 0, 0); }
        }
    </style>
</head>
<body>

    <!-- 頂部 HUD -->
    <div class="hud-bar">
        <div>
            <div>🎃 PUMPKIN PALADIN: LV.99</div>
            <div style="color: var(--jrpg-green); margin-top: 4px;">IDLE COST: $0.000/HR</div>
        </div>
        <div style="text-align: right;">
            <div id="burnHud" class="burn-alert">BURN DEFICIT: $0.096/HR</div>
            <div style="color: #94a3b8; margin-top: 4px;" id="zombieCountHud">ROGUE INSTANCES: 1</div>
        </div>
    </div>

    <!-- JRPG 戰鬥舞台 -->
    <div class="arena-container" id="arenaBox">
        <canvas id="battleCanvas"></canvas>
    </div>

    <!-- 下方操作台與戰鬥對話框 -->
    <div class="ui-dock">
        <!-- 戰鬥日誌 (JRPG 敘事風格) -->
        <div class="dialog-box">
            <div>
                <div class="dialog-title">⚔️ BATTLE TELEMETRY // REAL-TIME LOG</div>
                <div class="dialog-logs" id="logFeed">
                    <div>[SYS] CloudTrail scanned: Rogue EC2 Zombie detected!</div>
                    <div style="color: var(--jrpg-red);">[ALERT] Zombie is burning $0.096/hr idle resources!</div>
                </div>
            </div>
            <div style="font-size: 8px; color: #64748b; margin-top: 8px;">
                HOOK: Aegis Smite Pre-commit Active | Spec: Zero-Idle RFC
            </div>
        </div>

        <!-- 戰鬥指令按鈕 -->
        <div class="cmd-box">
            <button class="cmd-btn" style="border-color: var(--jrpg-gold);" onclick="heroSmite()">⚔️ SMITE</button>
            <button class="cmd-btn" style="border-color: var(--jrpg-red);" onclick="heroSmiteAll()">🔥 ALL SMITE</button>
            <button class="cmd-btn" style="border-color: var(--jrpg-blue);" onclick="heroReconcile()">📜 RECONCILE</button>
            <button class="cmd-btn" style="border-color: var(--jrpg-green);" onclick="spawnZombieEnemy()">🧟 SUMMON</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('battleCanvas');
        const ctx = canvas.getContext('2d');
        const arena = document.getElementById('arenaBox');

        function resizeCanvas() {
            canvas.width = arena.clientWidth;
            canvas.height = arena.clientHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // 戰鬥狀態
        let paladin = { x: 100, y: 190, baseX: 100, state: 'idle', frame: 0, slashTime: 0 };
        let zombies = [
            { id: 1, name: 'EC2:Zombie-01', x: 620, y: 190, hp: 100, cost: 0.096, dead: false, alpha: 1 }
        ];
        let damageTexts = [];
        let particles = [];
        let burnTotal = 0.096;

        // 浮動傷害數字
        class DamageText {
            constructor(x, y, text, color) {
                this.x = x;
                this.y = y;
                this.text = text;
                this.color = color;
                this.alpha = 1;
                this.vy = -2;
            }
            update() {
                this.y += this.vy;
                this.alpha -= 0.02;
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.fillStyle = this.color;
                ctx.font = '10px "Press Start 2P"';
                ctx.fillText(this.text, this.x, this.y);
                ctx.restore();
            }
        }

        // 金色爆發粒子
        class Spark {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.vx = (Math.random() - 0.5) * 12;
                this.vy = (Math.random() - 0.5) * 12;
                this.alpha = 1;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.alpha -= 0.03;
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.fillStyle = this.color;
                ctx.fillRect(this.x, this.y, 4, 4);
                ctx.restore();
            }
        }

        // 繪製南瓜聖騎士 (像素 JRPG 風格)
        function drawPaladin() {
            ctx.save();
            ctx.translate(paladin.x, paladin.y);

            // 浮動呼吸
            const bob = Math.sin(Date.now() / 200) * 3;

            // 聖光光環
            ctx.strokeStyle = 'rgba(250, 204, 21, 0.4)';
            ctx.lineWidth = 3;
            ctx.strokeRect(-18, -48 + bob, 36, 68);

            // 身體盔甲
            ctx.fillStyle = '#facc15';
            ctx.fillRect(-12, -20 + bob, 24, 30);
            ctx.fillStyle = '#3b82f6';
            ctx.fillRect(-6, -14 + bob, 12, 14);

            // 南瓜頭
            ctx.fillStyle = '#ea580c';
            ctx.fillRect(-16, -42 + bob, 32, 22);
            // 南瓜眼與嘴
            ctx.fillStyle = '#000';
            ctx.fillRect(-10, -36 + bob, 6, 6);
            ctx.fillRect(4, -36 + bob, 6, 6);
            ctx.fillRect(-6, -26 + bob, 12, 4);

            // 大劍
            if (paladin.state === 'attack') {
                ctx.fillStyle = '#fff';
                ctx.fillRect(18, -30 + bob, 36, 8);
                ctx.fillStyle = '#facc15';
                ctx.fillRect(12, -34 + bob, 6, 16);
            } else {
                ctx.fillStyle = '#fff';
                ctx.fillRect(-22, -30 + bob, 6, 32);
            }

            ctx.restore();
        }

        // 繪製雲端喪屍
        function drawZombies() {
            zombies.forEach((z, idx) => {
                if (z.alpha <= 0) return;
                ctx.save();
                ctx.globalAlpha = z.alpha;
                ctx.translate(z.x + (idx * 50), z.y);

                const zBob = Math.sin((Date.now() + idx * 300) / 250) * 2;

                // 喪屍名稱與血條
                ctx.fillStyle = '#ef4444';
                ctx.fillRect(-20, -45, 40, 6);
                ctx.fillStyle = '#22c55e';
                ctx.fillRect(-20, -45, (z.hp / 100) * 40, 6);

                ctx.font = '7px "Press Start 2P"';
                ctx.fillStyle = '#94a3b8';
                ctx.fillText('ZOMBIE', -18, -52);

                // 喪屍身體
                ctx.fillStyle = '#047857';
                ctx.fillRect(-10, -20 + zBob, 20, 28);
                // 腐朽頭顱
                ctx.fillStyle = '#10b981';
                ctx.fillRect(-14, -38 + zBob, 28, 18);
                // 紅色凶眼
                ctx.fillStyle = '#ef4444';
                ctx.fillRect(-8, -32 + zBob, 4, 4);
                ctx.fillRect(4, -32 + zBob, 4, 4);

                ctx.restore();
            });
        }

        // 動畫主循環
        function loop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 地面裝飾線
            ctx.strokeStyle = '#475569';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, 230);
            ctx.lineTo(canvas.width, 230);
            ctx.stroke();

            // 更新聖騎士衝刺
            if (paladin.state === 'attack') {
                paladin.x += (450 - paladin.x) * 0.25;
                if (Math.abs(paladin.x - 450) < 10) {
                    paladin.state = 'return';
                }
            } else if (paladin.state === 'return') {
                paladin.x += (paladin.baseX - paladin.x) * 0.2;
                if (Math.abs(paladin.x - paladin.baseX) < 2) {
                    paladin.x = paladin.baseX;
                    paladin.state = 'idle';
                }
            }

            drawPaladin();
            drawZombies();

            // 粒子更新
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                particles[i].draw();
                if (particles[i].alpha <= 0) particles.splice(i, 1);
            }

            // 飄字更新
            for (let i = damageTexts.length - 1; i >= 0; i--) {
                damageTexts[i].update();
                damageTexts[i].draw();
                if (damageTexts[i].alpha <= 0) damageTexts.splice(i, 1);
            }

            requestAnimationFrame(loop);
        }
        loop();

        // 觸發震動
        function triggerShake() {
            arena.classList.add('screen-shake');
            setTimeout(() => arena.classList.remove('screen-shake'), 350);
        }

        function addLog(text, color = '#94a3b8') {
            const feed = document.getElementById('logFeed');
            const row = document.createElement('div');
            row.style.color = color;
            row.innerText = `[${new Date().toTimeString().split(' ')[0]}] ${text}`;
            feed.prepend(row);
        }

        function updateHUD() {
            const activeZombies = zombies.filter(z => !z.dead).length;
            burnTotal = activeZombies * 0.096;
            document.getElementById('burnHud').innerText = `BURN DEFICIT: $${burnTotal.toFixed(3)}/HR`;
            document.getElementById('zombieCountHud').innerText = `ROGUE INSTANCES: ${activeZombies}`;
        }

        // 指令 1: 聖裁單體普攻
        function heroSmite() {
            const target = zombies.find(z => !z.dead);
            if (!target) {
                addLog('No rogue zombies detected. Sacred sanctuary is calm!', '#facc15');
                return;
            }
            paladin.state = 'attack';
            setTimeout(() => {
                triggerShake();
                target.hp = 0;
                target.dead = true;
                damageTexts.push(new DamageText(550, 160, '9999 SMITE!', '#facc15'));
                for (let i = 0; i < 25; i++) particles.push(new Spark(580, 180, '#facc15'));
                
                // 消散漸變
                let fade = setInterval(() => {
                    target.alpha -= 0.1;
                    if (target.alpha <= 0) {
                        clearInterval(fade);
                        updateHUD();
                    }
                }, 40);

                addLog(`⚡ AEGIS SMITE: Terminated ${target.name}. Saved $0.096/hr!`, '#facc15');
            }, 180);
        }

        // 指令 2: 神聖風暴 全屏斬殺
        function heroSmiteAll() {
            const targets = zombies.filter(z => !z.dead);
            if (targets.length === 0) {
                addLog('Zero rogue entities. Realm is pristine!', '#22c55e');
                return;
            }
            paladin.state = 'attack';
            setTimeout(() => {
                triggerShake();
                targets.forEach((t, i) => {
                    t.hp = 0;
                    t.dead = true;
                    damageTexts.push(new DamageText(500 + (i * 40), 150 - (i * 15), 'CRIT 9999!', '#ef4444'));
                    for (let p = 0; p < 20; p++) particles.push(new Spark(550 + (i * 40), 180, '#ef4444'));
                    t.alpha = 0;
                });
                updateHUD();
                addLog(`🔥 DIVINE SMITE ALL: Cleared ${targets.length} zombies. Zero-Idle restored!`, '#ef4444');
            }, 200);
        }

        // 指令 3: 對帳法典結算
        function heroReconcile() {
            triggerShake();
            damageTexts.push(new DamageText(120, 150, '+10 TX SETTLED', '#3b82f6'));
            for (let i = 0; i < 20; i++) particles.push(new Spark(120, 180, '#3b82f6'));
            addLog('📜 GrimReconciler: 10 transactions settled to DynamoDB (TTL 7-Day active).', '#3b82f6');
        }

        // 指令 4: 召喚浪費喪屍
        function spawnZombieEnemy() {
            const newId = zombies.length + 1;
            zombies.push({
                id: newId,
                name: `EC2:Zombie-0${newId}`,
                x: 550 + (Math.random() * 40),
                y: 190,
                hp: 100,
                cost: 0.096,
                dead: false,
                alpha: 1
            });
            updateHUD();
            addLog(`⚠️ UNBUDGETED SPAWN: Rogue EC2 Zombie appeared! Burn +$0.096/hr!`, '#ef4444');
        }
    </script>
</body>
</html>
